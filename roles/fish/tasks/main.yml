---

- name: Add fish to shells.
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: "{{ lookup('pipe', 'which fish') }}"
  become: true

- name: Ensure fish shell functions directory exists.
  ansible.builtin.file:
    dest: "{{ ansible_facts['user_dir'] }}/.config/fish/functions"
    state: directory
    mode: "0755"

- name: Change default shell to fish.
  ansible.builtin.user:
    name: "{{ fish_user }}"
    shell: "{{ lookup('pipe', 'which fish') }}"
  become: true

- name: Place fish config.
  ansible.builtin.template:
    src: config.fish
    dest: "{{ fish_config_file }}"
    mode: "0644"
    backup: true

- name: Install fisher with plugins
  ansible.builtin.include_tasks: fisher.yml
  when: "fish_fisher_enabled | default(omit)"
